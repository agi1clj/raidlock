name: Web UI

on:
  push:
    branches: [main]
    paths: ["src/raidlock/web/**", "tests/web/**", "uv.lock", ".github/workflows/web.yml"]
  pull_request:
    paths: ["src/raidlock/web/**", "tests/web/**", "uv.lock", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  playwright:
    name: web UI (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.0-noble@sha256:684df257a1fa0ef3fa288239819984008f560e8f8db5b635ee9e2a50cbcd2e23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Run web tests
        run: uv run --locked --extra ui-test --with pytest-xdist==3.8.0 pytest -n auto tests/web
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

