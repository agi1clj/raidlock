name: macOS

on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/raidlock/runners/**", "src/raidlock/hooks.py", "src/raidlock/core/**", "src/raidlock/cli.py", "tests/runners/**", "tests/hooks/**", "tests/land/**", "uv.lock", ".github/workflows/macos.yml"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test:
    name: test (macos-latest, py3.14)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Run tests
        run: uv run --locked --with pytest-xdist==3.8.0 pytest -n auto --ignore=tests/web
