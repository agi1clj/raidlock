name: Docker

on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", "src/**", "scripts/docker-smoke.sh", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", "src/**", "scripts/docker-smoke.sh", ".github/workflows/docker.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: raidlock:ci
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --platform linux/amd64 -t "$IMAGE" .
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Show namespace support
        run: |
          docker version --format 'docker {{.Server.Version}}'
          sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces 2>/dev/null || true
      - name: Smoke test in a hardened container
        continue-on-error: true
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --security-opt apparmor=unconfined --network none \
            --tmpfs /tmp:uid=10001,gid=10001,mode=1777 \
            --tmpfs /home/raid:uid=10001,gid=10001,mode=0700 \
            --tmpfs /workspace:uid=10001,gid=10001,mode=0700 \
            -v "$PWD/scripts/docker-smoke.sh:/smoke.sh:ro" \
            --entrypoint sh "$IMAGE" /smoke.sh
      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" trivy
      - name: Trivy image scan
        run: ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE"
