name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/agi1clj/raidlock

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-pr-ci:
    name: Test the release PR
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      # The Actions token opens the release PR, so GitHub holds its pull_request runs as
      # action_required. Only those PR-linked runs satisfy the required checks, so approve them.
      - name: Approve the release PR's held runs
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          approved=0
          for _ in $(seq 12); do
            ids=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --commit "$sha" \
              --event pull_request --status action_required --json databaseId --jq '.[].databaseId')
            for id in $ids; do
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" --silent; then
                echo "approved run $id"
                approved=$((approved + 1))
              else
                echo "::warning::could not approve run $id"
              fi
            done
            if [ "$approved" -gt 0 ] && [ -z "$ids" ]; then exit 0; fi
            sleep 10
          done
          if [ "$approved" -eq 0 ]; then
            echo "::warning::no held pull_request runs for $sha on $BRANCH after 2 minutes; approve them on the release PR's Checks tab"
          fi

  publish:
    name: PyPI and signed release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/raidlock
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
      - name: Build
        run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
      - name: Sign and attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          uvx --from sigstore==4.5.1 sigstore sign dist/*.tar.gz dist/*.whl
          gh release upload "$TAG" dist/*.tar.gz dist/*.whl dist/*.sigstore.json --clobber

  image:
    name: Container image
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Version from tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
