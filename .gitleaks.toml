title = "Raidlock secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Dummy credentials in tests/core/test_transcript.py"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/core/test_transcript\.py$''']
regexes = ['''^(?:AKIAABCDEFGHIJKLMNOP|sk\-ant\-api03\-abcdefghijklmnopqrstuvwxyz|ghp_abcdefghijklmnopqrstuvwxyz0123456789|xoxb\-1234567890\-abcdefghij|eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdefghijklmnop|\-\-\-\-\-BEGIN\ RSA\ PRIVATE\ KEY\-\-\-\-\-|hunter2xyz|abcd1234|supersecretvalue|sk\-proj\-abcdefghijklmnopqrstuvwx)$''']

[[allowlists]]
description = "Dummy credentials in tests/core/test_model.py"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/core/test_model\.py$''']
regexes = ['''^(?:abcd1234secret)$''']

[[allowlists]]
description = "Dummy credentials in tests/scan/fixtures/secrets.patch"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/scan/fixtures/secrets\.patch$''']
regexes = ['''^(?:AKIAABCDEFGHIJKLMNOP|ghp_abcdefghijklmnopqrstuvwxyz0123456789|sk\-proj\-abcdefghijklmnopqrstuvwxyz0123456789|sk\-ant\-api03\-abcdefghijklmnopqrstuvwxyz0123456789|\-\-\-\-\-BEGIN\ RSA\ PRIVATE\ KEY\-\-\-\-\-|aZ9bY8cX7dW6eV5fU4gT3hS2iR1jQ0)$''']

